<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공고 상세 - 히트분양</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .detail-card {
            background: #fff; border-radius: 16px; padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 800px; margin: 0 auto;
        }
        .detail-grade { display: inline-block; padding: 4px 12px; border-radius: 6px;
            font-size: 12px; font-weight: 800; color: #fff; margin-bottom: 12px; }
        .detail-grade-ad { background: #e74c3c; }
        .detail-grade-premium { background: #f39c12; }
        .detail-grade-superior { background: #3498db; }
        .detail-grade-basic { background: #27ae60; }
        .detail-title { font-size: 22px; font-weight: 800; color: #2c3e50; margin-bottom: 20px; line-height: 1.4; }
        .detail-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
        .detail-table th { background: #f8f9fa; padding: 12px 16px; text-align: left;
            font-size: 13px; color: #666; width: 120px; border-bottom: 1px solid #eee; }
        .detail-table td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #eee; }
        .detail-desc { background: #f8f9fa; padding: 20px; border-radius: 10px;
            font-size: 14px; line-height: 1.8; margin-bottom: 24px; white-space: pre-wrap; }
        .detail-contact { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff;
            padding: 24px; border-radius: 12px; text-align: center; }
        .detail-contact-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .detail-contact-phone { font-size: 24px; font-weight: 800; }
        .detail-contact-phone a { color: #fff; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-main">
        <div class="container">
            <div class="header-main-inner">
                <a href="../index.html" class="logo">
                    <span class="logo-hit">히트</span><span class="logo-bunyang">분양</span>
                </a>
                <nav class="nav" id="mainNav">
                    <a href="../index.html" class="nav-link">홈</a>
                    <a href="jobs.html" class="nav-link active">구인공고</a>
                    <a href="complexes.html" class="nav-link">분양단지</a>
                </nav>
                <button class="mobile-toggle" onclick="toggleMenu()">☰</button>
            </div>
        </div>
    </div>
</header>

<main class="section">
    <div class="container">
        <a href="jobs.html" class="back-btn">← 목록으로</a>
        <div class="detail-card" id="jobDetail">
            <p style="text-align:center;color:#999;padding:40px;">로딩중...</p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-logo"><span class="logo-hit">히트</span><span class="logo-bunyang">분양</span></div>
            <div class="footer-info"><p>© 2025 히트분양. All rights reserved.</p></div>
        </div>
    </div>
</footer>

<script src="../js/config.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadJobDetail);

    async function loadJobDetail() {
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        if (!id) { document.getElementById('jobDetail').innerHTML = '<p>잘못된 접근입니다.</p>'; return; }

        // 조회수 증가
        await supabase.rpc('increment_view', { job_id: parseInt(id) }).catch(() => {});

        const { data: job, error } = await supabase
            .from('job_posts')
            .select('*')
            .eq('id', id)
            .single();

        if (error || !job) {
            document.getElementById('jobDetail').innerHTML = '<p>공고를 찾을 수 없습니다.</p>';
            return;
        }

        const gradeLabels = { ad: 'AD', premium: '프리미엄', superior: '슈페리어', basic: '베이직', normal: '일반' };

        document.title = `${job.title} - 히트분양`;

        document.getElementById('jobDetail').innerHTML = `
            <span class="detail-grade detail-grade-${job.ad_grade}">${gradeLabels[job.ad_grade] || '일반'}</span>
            <h1 class="detail-title">${esc(job.title)}</h1>

            <table class="detail-table">
                <tr><th>현장명</th><td>${esc(job.site_name)}</td></tr>
                <tr><th>소재지</th><td>${esc(job.location_sido)} ${esc(job.location_sigungu || '')} ${esc(job.location_address || '')}</td></tr>
                <tr><th>분양유형</th><td>${esc(job.property_type)}</td></tr>
                <tr><th>모집직급</th><td>${esc(job.recruit_position)}</td></tr>
                <tr><th>수수료</th><td><strong style="color:#e74c3c;">${esc(job.commission_rate || '협의')}</strong></td></tr>
                ${job.daily_pay ? `<tr><th>일비</th><td>${esc(job.daily_pay)}</td></tr>` : ''}
                ${job.dormitory_pay ? `<tr><th>숙소비</th><td>${esc(job.dormitory_pay)}</td></tr>` : ''}
                <tr><th>경력조건</th><td>${esc(job.experience)}</td></tr>
                <tr><th>대행사</th><td>${esc(job.company || '-')}</td></tr>
                <tr><th>등록일</th><td>${new Date(job.created_at).toLocaleDateString('ko-KR')}</td></tr>
                <tr><th>조회수</th><td>${(job.view_count || 0).toLocaleString()}</td></tr>
            </table>

            ${job.description ? `<div class="detail-desc">${esc(job.description)}</div>` : ''}

            <div class="detail-contact">
                <div class="detail-contact-name">${esc(job.contact_name || '담당자')}</div>
                <div class="detail-contact-phone">
                    <a href="tel:${job.contact_phone || ''}">${esc(job.contact_phone || '전화번호 비공개')}</a>
                </div>
            </div>
        `;
    }

    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
    }
</script>
</body>
</html>
